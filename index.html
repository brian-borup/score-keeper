<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Score Keeper</title>
  <meta name="description" content="Keep score for any game, round by round.">
  <meta name="theme-color" content="#09a4f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Score Keeper">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Score Keeper</h1>
    <div class="menu-wrap">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <div id="menu" class="menu" hidden>
        <div class="menu-section" role="group" aria-label="Which score wins">
          <span class="menu-label">Winner</span>
          <div class="segmented">
            <button id="highWinsBtn" type="button" aria-pressed="true">High score</button>
            <button id="lowWinsBtn" type="button" aria-pressed="false">Low score</button>
          </div>
        </div>
        <button id="clearScoresBtn" class="menu-item" type="button">Clear scores</button>
        <button id="clearPlayersBtn" class="menu-item danger-text" type="button">Clear all players</button>
      </div>
    </div>
  </header>

  <main>
    <div class="table-wrap" id="tableWrap">
      <table class="scores" id="scores">
        <thead id="scoresHead"></thead>
        <tbody id="scoresBody"></tbody>
      </table>
    </div>

    <div class="actions">
      <button id="addRoundBtn" class="primary">+ Round</button>
    </div>
  </main>

  <!-- Are-you-sure prompt for clearing or deleting -->
  <dialog id="confirmDialog" class="sheet">
    <form method="dialog">
      <p class="sheet-title" id="confirmTitle"></p>
      <p class="sheet-message" id="confirmMessage"></p>
      <div class="sheet-row">
        <button value="cancel" class="secondary">Cancel</button>
        <button value="ok" id="confirmOkBtn" class="danger"></button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
